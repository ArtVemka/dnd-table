name: Сборка

# Собирает переносимые комплекты игры под Windows и Linux и, если сборка
# запушена на теге, прикрепляет их к релизу на GitHub.
#
# Используются только официальные actions GitHub и gh из стандартного образа
# runner: никаких сторонних action'ов в сборку не попадает.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Проверки сервера идут до сборки и останавливают прогон, если код сломан.
      # В наборе есть гонка по картам: проверка может сработать раньше, чем сервер
      # применит событие. Поэтому одна попытка на повтор — иначе сборка падает
      # случайно, и к красным билдам привыкают.
      - name: Проверить сервер
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if node test/integration.js; then
              echo "Проверки пройдены с попытки ${attempt}"
              exit 0
            fi
            echo "Попытка ${attempt} не удалась, повторяем"
            sleep 5
          done
          echo "::error::Проверки сервера не прошли даже со второй попытки"
          exit 1

      - name: Собрать переносимый комплект
        # dist:portable сам собирает приложение и пакует его, поэтому отдельного
        # шага «npm run dist» нет: раньше приложение собиралось дважды за прогон.
        run: npm run dist:portable

      - name: Проверить результат сборки
        shell: bash
        run: |
          set -uo pipefail
          echo "dist-final содержит:"
          ls -la dist-final || true
          for d in dist-final/*/; do
            echo "--- ${d}: $(find "$d" -type f | wc -l) файлов"
            ls -la "$d" | head -5
          done
          echo "exe найден: $(find dist-final -maxdepth 2 -name '*.exe' -o -maxdepth 2 -name 'DND-Table' | head -3)"

      - name: Переименовать архив под платформу
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # Ищем архив по маске, а не по имени: в нём кириллица, и её
          # потеря при передаче скрипта в bash ломала бы путь.
          shopt -s nullglob
          archives=(release/*.zip)
          if [ ${#archives[@]} -ne 1 ]; then
            echo "Ожидался ровно один архив, найдено: ${#archives[@]}" >&2
            exit 1
          fi
          mv "${archives[0]}" "release/DND-Table-${version}-${{ matrix.artifact }}.zip"
          ls -la release/*.zip

      - name: Прикрепить артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: dnd-table-${{ matrix.artifact }}
          path: release/DND-Table-*.zip
          retention-days: 30

  release:
    name: Опубликовать релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Оба комплекта собираются параллельно, а релиз создаётся один раз
      # после них обоих — иначе задания начали бы гонку за один и тот же тег.
      - name: Забрать собранные комплекты
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dnd-table-*
          merge-multiple: true

      # Описание готовим отдельным шагом и передаём файлом: heredoc в той же
      # команде ломался о перенос строки перед --notes-file, и gh создавал
      # релиз вовсе без вложений.
      - name: Подготовить описание релиза
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          ## D&D Стол

          Переносимая версия: установка не нужна. Распакуйте архив целиком
          и запустите игру. Кампании, карты и картинки складываются в папку
          `data` рядом с игрой — перенос папки целиком переносит всю сессию.

          ### Как скачать

          | Файл | Система |
          |---|---|
          | `DND-Table-*-windows-x64.zip` | Windows 64 бита |
          | `DND-Table-*-linux-x64.zip` | Linux 64 бита |

          ### Что нового

          **Ссылки на dnd.su прямо в справочнике.** Название предмета или
          персонажа теперь кликабельно: открывает статью с описанием в
          браузере. Ссылки берутся из локального указателя на 1894 названия,
          собранного с каталога сайта, поэтому работают мгновенно и без сети,
          а битых ссылок нет: нет предмета в указателе — нет и ссылки.

          **Группировка и массовая картинка.** Одинаковые объекты
          складываются в группу с пометкой «× 20» вместо двадцати одинаковых
          карточек. Один раз загруженная картинка встаёт сразу на всю группу —
          и на все фишки с этим названием на картах, и на все предметы.

          **Пять тем оформления.** «Стандартная», «Лес», «Магия», «Океан» и
          «Трактир». У каждой свой цвет, рамки, шрифты и анимации: в «Лесу»
          ползут пятна солнца, в «Магии» проступают искры, в «Океане» идёт
          волна, в «Трактире» дрожит свет свечей. Переключаются в настройках,
          выбор сохраняется и в окне листа персонажа.

          **Сетка под размер карты.** В настройках появилось поле «клеток по
          ширине карты»: мастер пишет, сколько клеток укладывается по ширине,
          а размер клетки считается от настоящей ширины подложки. Фишка всегда
          занимает ровно одну клетку, в обоих режимах и при любом увеличении.

          **Импорт приключений из Foundry VTT.** Кнопка «Импортировать
          приключение…» в панели адресов. Подойдёт выгрузка приключения в JSON
          или ZIP. Сначала игра покажет, что она нашла и что можно перенести,
          вы отмечаете нужное галочками и жмёте «Импортировать»:

          * сцены становятся картами, а их фишки — фишками на столе;
          * персонажи, предметы и заметки попадают в справочник приключения;
          * макросы видны в списке, но не переносятся и никогда не выполняются.

          Лист персонажа при импорте не заполняется: для актёров создаётся
          запись в справочнике, а лист заполняется вручную.

          ### Что ещё поправили

          * Фишка теперь принадлежит конкретной карте, а не вкладке: при
            импорте двух сцен в одну вкладку фишки больше не наезжают друг на
            друга.
          * Справочник прокручивается внутри своей панели и больше не выходит
            за её рамку.
          * Импорт читает настоящую форму выгрузки Foundry: фон сцены, текст
            заметок из страниц, имя фишки из delta.
          * Игра стала заметно отзывчивее: справочник не перестраивается на
            каждое движение фишки, поиск не тормозит, история бросков и чата
            ограничена.

          ### Про сеть

          Игра не создаёт сеть и не поднимает VPN. Участники должны быть в одной
          локальной или виртуальной сети (Hamachi, Radmin VPN, ZeroTier), либо
          на столе у ДМ должен быть проброс порта. Альтернатива — P2P по
          билету iroh-endpoint из панели адресов на экране стола.
          EOF          EOF
          cat notes.md

      - name: Опубликовать релиз
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "Готовы к отправке файлы:"
          ls -la dist/*.zip
          gh release view "v${version}" >/dev/null 2>&1 && {
            echo "Релиз v${version} уже существует — добавляем файлы"
            gh release upload "v${version}" dist/*.zip --clobber
          } || {
            gh release create "v${version}" \
              --title "D&D Стол ${version}" \
              --notes-file notes.md \
              dist/*.zip
          }
          echo "=== файлы релиза ==="
          gh release view "v${version}" --json assets --jq '.assets[].name'