<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; font-src 'self' data:;"
    />
    <title>Лист персонажа</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <!-- Оформление разбито на девять частей по порядку номеров: CSS зависит
         от порядка правил одинаковой специфичности, и перестановка частей
         молча изменила бы вид. Правится файл целиком, читается по части. -->
    <link rel="stylesheet" href="styles/01-tokens.css" />
    <link rel="stylesheet" href="styles/02-screens.css" />
    <link rel="stylesheet" href="styles/03-controls.css" />
    <link rel="stylesheet" href="styles/04-layout.css" />
    <link rel="stylesheet" href="styles/05-map.css" />
    <link rel="stylesheet" href="styles/06-panels.css" />
    <link rel="stylesheet" href="styles/07-sheet.css" />
    <link rel="stylesheet" href="styles/08-theme-layer.css" />
    <link rel="stylesheet" href="styles/09-theme-studio.css" />
  </head>
  <body class="sheet-window">
    <div id="toasts" class="toasts"></div>

    <header class="sheet-window__bar">
      <div class="sheet-window__titles">
        <div id="sheet-title" class="sheet-window__title">Лист персонажа</div>
        <div id="sheet-sub" class="sheet-window__sub muted">подключаемся к столу…</div>
      </div>
      <div class="sheet-window__actions">
        <span id="sheet-conn" class="badge badge--muted">—</span>
        <button id="btn-refresh-sheet" class="btn btn--tiny" type="button">Обновить</button>
      </div>
    </header>

    <main class="sheet-window__body">
      <div id="sheet-root" class="panel panel--tab is-active"></div>
    </main>

    <script src="vendor/socket.io.min.js"></script>
    <script src="dnd5e.js"></script>
    <script src="sheet.js"></script>
    <script src="local-table.js"></script>
    <script src="sheet-window.js"></script>
  </body>
</html>
