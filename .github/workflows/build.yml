name: Сборка

# Собирает переносимые комплекты игры под Windows и Linux и, если сборка
# запушена на теге, прикрепляет их к релизу на GitHub.
#
# Используются только официальные actions GitHub и gh из стандартного образа
# runner: никаких сторонних action'ов в сборку не попадает.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Проверки сервера идут до сборки и останавливают прогон, если код сломан.
      # В наборе есть гонка по картам: проверка может сработать раньше, чем сервер
      # применит событие. Поэтому одна попытка на повтор — иначе сборка падает
      # случайно, и к красным билдам привыкают.
      - name: Проверить сервер
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if node test/integration.js; then
              echo "Проверки пройдены с попытки ${attempt}"
              exit 0
            fi
            echo "Попытка ${attempt} не удалась, повторяем"
            sleep 5
          done
          echo "::error::Проверки сервера не прошли даже со второй попытки"
          exit 1

      - name: Собрать переносимый комплект
        # dist:portable сам собирает приложение и пакует его, поэтому отдельного
        # шага «npm run dist» нет: раньше приложение собиралось дважды за прогон.
        run: npm run dist:portable

      - name: Проверить результат сборки
        shell: bash
        run: |
          set -uo pipefail
          echo "dist-final содержит:"
          ls -la dist-final || true
          for d in dist-final/*/; do
            echo "--- ${d}: $(find "$d" -type f | wc -l) файлов"
            ls -la "$d" | head -5
          done
          echo "exe найден: $(find dist-final -maxdepth 2 -name '*.exe' -o -maxdepth 2 -name 'DND-Table' | head -3)"

      - name: Переименовать архив под платформу
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # Ищем архив по маске, а не по имени: в нём кириллица, и её
          # потеря при передаче скрипта в bash ломала бы путь.
          shopt -s nullglob
          archives=(release/*.zip)
          if [ ${#archives[@]} -ne 1 ]; then
            echo "Ожидался ровно один архив, найдено: ${#archives[@]}" >&2
            exit 1
          fi
          mv "${archives[0]}" "release/DND-Table-${version}-${{ matrix.artifact }}.zip"
          ls -la release/*.zip

      - name: Прикрепить артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: dnd-table-${{ matrix.artifact }}
          path: release/DND-Table-*.zip
          retention-days: 30

  release:
    name: Опубликовать релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Оба комплекта собираются параллельно, а релиз создаётся один раз
      # после них обоих — иначе задания начали бы гонку за один и тот же тег.
      - name: Забрать собранные комплекты
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dnd-table-*
          merge-multiple: true

      # Описание готовим отдельным шагом и передаём файлом: heredoc в той же
      # команде ломался о перенос строки перед --notes-file, и gh создавал
      # релиз вовсе без вложений.
      - name: Подготовить описание релиза
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          ## D&D Стол

          Переносимая версия: установка не нужна. Распакуйте архив целиком
          и запустите игру. Кампании, карты и картинки складываются в папку
          `data` рядом с игрой — перенос папки целиком переносит всю сессию.

          ### Как скачать

          | Файл | Система |
          |---|---|
          | `DND-Table-*-windows-x64.zip` | Windows 64 бита |
          | `DND-Table-*-linux-x64.zip` | Linux 64 бита |

          ### Что нового в 0.12.1

          Небольшой релиз с исправлениями. Если у вас стоит 0.12b, обновление
          ничего не ломает: все настройки, кампании и справочники на месте.

          **Игрок может вынести свой лист в отдельное окно.** Кнопка была
          на месте и права были в порядке, но окно листа требовало, чтобы
          сервер был запущен в этом же процессе, а он есть только у мастера.
          Игрок, подключившийся к чужому столу, получал отказ «стол не
          запущен». Теперь окно получает адрес стола от игрока и открывается.
          У мастера поведение прежнее.

          **Лист персонажа перестал расходиться с тем, что сохраняется.**
          Форма числа не ограничивала вовсе, а сервер резал их по своим
          пределам: игрок вводил в Силу 99, видел модификатор +44, а в кампанию
          попадало 30, и исправления он не видел. Теперь режет форма теми же
          числами. Заодно перестали накапливаться мелочи того же рода: пустое
          поле уходило как ноль и после перезагрузки превращалось в единицу,
          дробные значения округлял только сервер, а компетентность можно было
          оставить включённой без владения, и сервер молча её обнулял.

          ### Что ещё вошло с прошлых версий

          Ссылки на dnd.su прямо в справочнике: название предмета кликабельно,
          работает без сети, битых ссылок нет. Группировка объектов с пометкой
          «× 20» и массовая картинка на всю группу. Пять тем оформления со
          своими рамками, шрифтами и анимациями. Сетка подгоняется под размер
          карты, фишка всегда ровно в клетку. Импорт приключений из Foundry
          VTT вместе со справочником приключения.

          ### Про сеть

          Игра не создаёт сеть и не поднимает VPN. Участники должны быть в одной
          локальной или виртуальной сети (Hamachi, Radmin VPN, ZeroTier), либо
          на столе у ДМ должен быть проброс порта. Альтернатива — P2P по
          билету iroh-endpoint из панели адресов на экране стола.
          EOF          EOF          EOF
          cat notes.md

      - name: Опубликовать релиз
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "Готовы к отправке файлы:"
          ls -la dist/*.zip
          gh release view "v${version}" >/dev/null 2>&1 && {
            echo "Релиз v${version} уже существует — добавляем файлы"
            gh release upload "v${version}" dist/*.zip --clobber
          } || {
            gh release create "v${version}" \
              --title "D&D Стол ${version}" \
              --notes-file notes.md \
              dist/*.zip
          }
          echo "=== файлы релиза ==="
          gh release view "v${version}" --json assets --jq '.assets[].name'