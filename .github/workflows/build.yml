name: Сборка

# Собирает переносимые комплекты игры под Windows и Linux и, если сборка
# запушена на теге, прикрепляет их к релизу на GitHub.
#
# Используются только официальные actions GitHub и gh из стандартного образа
# runner: никаких сторонних action'ов в сборку не попадает.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить оформление
        run: node test/styles.js

      - name: Проверить импорт и лист
        run: node test/importer.js && node test/sheet.js

      # Проверки сервера идут до сборки и останавливают прогон, если код сломан.
      # В наборе есть гонка по картам: проверка может сработать раньше, чем сервер
      # применит событие. Поэтому одна попытка на повтор — иначе сборка падает
      # случайно, и к красным билдам привыкают.
      - name: Проверить сервер
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if node test/integration.js; then
              echo "Проверки пройдены с попытки ${attempt}"
              exit 0
            fi
            echo "Попытка ${attempt} не удалась, повторяем"
            sleep 5
          done
          echo "::error::Проверки сервера не прошли даже со второй попытки"
          exit 1

      - name: Проверить мост Android
        run: node test/android-bridge.js

      - name: Собрать переносимый комплект
        # dist:portable сам собирает приложение и пакует его, поэтому отдельного
        # шага «npm run dist» нет: раньше приложение собиралось дважды за прогон.
        run: npm run dist:portable

      - name: Проверить результат сборки
        shell: bash
        run: |
          set -uo pipefail
          echo "dist-final содержит:"
          ls -la dist-final || true
          for d in dist-final/*/; do
            echo "--- ${d}: $(find "$d" -type f | wc -l) файлов"
            ls -la "$d" | head -5
          done
          echo "exe найден: $(find dist-final -maxdepth 2 -name '*.exe' -o -maxdepth 2 -name 'DND-Table' | head -3)"

      - name: Переименовать архив под платформу
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # Ищем архив по маске, а не по имени: в нём кириллица, и её
          # потеря при передаче скрипта в bash ломала бы путь.
          shopt -s nullglob
          archives=(release/*.zip)
          if [ ${#archives[@]} -ne 1 ]; then
            echo "Ожидался ровно один архив, найдено: ${#archives[@]}" >&2
            exit 1
          fi
          mv "${archives[0]}" "release/DND-Table-${version}-${{ matrix.artifact }}.zip"
          ls -la release/*.zip

      - name: Прикрепить артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: dnd-table-${{ matrix.artifact }}
          path: release/DND-Table-*.zip
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Подготовить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить зависимости
        run: npm ci

      - name: Сделать gradlew исполняемым
        run: chmod +x android/gradlew

      - name: Собрать debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Проверить мобильную раскладку
        run: xvfb-run -a npx electron --no-sandbox test/android-layout.js

      - name: Подготовить ключ подписи
        id: keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::Нет секрета $name, к релизу пойдёт debug APK"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Собрать подписанный release APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Подготовить APK к публикации
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
              "release/DND-Table-${version}-android.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk \
              "release/DND-Table-${version}-android-debug.apk"
          fi
          ls -la release/*.apk

      - name: Прикрепить APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dnd-table-android
          path: release/DND-Table-*-android*.apk
          retention-days: 30

  release:
    name: Опубликовать релиз
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Оба комплекта собираются параллельно, а релиз создаётся один раз
      # после них обоих — иначе задания начали бы гонку за один и тот же тег.
      - name: Забрать собранные комплекты
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dnd-table-*
          merge-multiple: true

      # Описание релиза лежит в репозитории отдельным файлом, а не пишется
      # прямо здесь heredoc-ом: многострочный русский текст в YAML ломался
      # закрывающим маркером, и релиз уходил с мусором в конце описания.
      - name: Подготовить описание релиза
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          notes="docs/release-notes-${version}.md"
          if [ -f "$notes" ]; then
            cp "$notes" notes.md
          else
            echo "::warning::Нет файла $notes, описание релиза будет пустым"
            printf '## D&D Стол %s\n' "$version" > notes.md
          fi
          wc -l notes.md

      - name: Опубликовать релиз
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "Готовы к отправке файлы:"
          ls -la dist/*.zip dist/*.apk
          gh release view "v${version}" >/dev/null 2>&1 && {
            echo "Релиз v${version} уже существует — добавляем файлы"
            gh release upload "v${version}" dist/*.zip dist/*.apk --clobber
          } || {
            gh release create "v${version}" \
              --title "D&D Стол ${version}" \
              --notes-file notes.md \
              dist/*.zip dist/*.apk
          }
          echo "=== файлы релиза ==="
          gh release view "v${version}" --json assets --jq '.assets[].name'